version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel56-app
    volumes:
      - .:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hub_db
      DB_USERNAME: root
      DB_PASSWORD: root

  web:
    image: nginx:latest
    container_name: laravel56-nginx
    ports:
      - "8090:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:5.7
    container_name: mysql56-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hub_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel56-phpmyadmin
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 256M 
      PHP_UPLOAD_MAX_FILESIZE: 256M
      PHP_POST_MAX_SIZE: 256M
    depends_on:
      - db

volumes:
  dbdata:
