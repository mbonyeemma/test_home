# version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel56-app
    container_name: laravel56-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8090:80"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hub_db
      DB_USERNAME: root
      DB_PASSWORD: root
      NUMBER_OF_DAYS_CUT_OFF_FOR_PACKAGES: 30
      NUMBER_OF_DAYS_CUT_OFF_FOR_PACKAGES_OFF_LINE_MODE: 30

  db:
    image: mysql:8.0
    container_name: mysql56-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hub_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: laravel56-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  dbdata: