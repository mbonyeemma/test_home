# version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: laravel56-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    mem_limit: 128m
    mem_reservation: 64m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel56-app
    container_name: laravel56-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hub_db
      DB_USERNAME: root
      DB_PASSWORD: root
    mem_limit: 1g
    mem_reservation: 512m
    # Remove health check for now
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  db:
    image: mysql:8.0
    container_name: mysql56-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hub_db
      MYSQL_ROOT_PASSWORD: root
      # Optimize MySQL for reasonable memory usage
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
      MYSQL_INNODB_LOG_FILE_SIZE: 64M
      MYSQL_INNODB_LOG_BUFFER_SIZE: 16M
      MYSQL_MAX_CONNECTIONS: 100
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    mem_limit: 512m
    mem_reservation: 256m
    # Add MySQL optimization
    command: --innodb-buffer-pool-size=256M --innodb-log-file-size=64M --max-connections=100

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: laravel56-phpmyadmin
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 128M
      PHP_UPLOAD_MAX_FILESIZE: 128M
      PHP_POST_MAX_SIZE: 128M
      # Reasonable PHP memory usage
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 60
    depends_on:
      - db
    mem_limit: 256m
    mem_reservation: 128m

volumes:
  dbdata: